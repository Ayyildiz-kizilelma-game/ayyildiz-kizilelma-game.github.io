name: Testler
# V2.56: Bu iş yalnız denetim yapar: derlenmiş dosyalar kaynakla aynı mı, bütün başsız testler geçiyor mu.
# Yayını GitHub Pages'in kendisi yapar (Ayarlar → Pages → "Deploy from a branch", main, kök klasör). Eskiden burada ikinci
# bir yayın adımı vardı; Pages ayarı daldan yayın olduğu için o adım her gönderimde "artifact bulunamadı" hatası veriyordu.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: python3 tools/build.py --check
      - run: node tests/paralel.js
